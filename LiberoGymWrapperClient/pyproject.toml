[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liberogymwrapperclient"
version = "0.1.1"

authors = [
  { name="JIANG Hankun", email="hankunjiang@outlook.com" },
]
description = "A Gymnasium Wrapper for libero"
readme = "README.md" 
requires-python = ">3.8" 

dependencies = [
    "flask",
    "numpy",
    "requests",
    "matplotlib",
    "opencv-python",
    "Pillow",
]

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.package-data]
liberogymwrapperclient = ["py.typed"]
